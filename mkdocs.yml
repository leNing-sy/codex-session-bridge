site_name: Codex Session Bridge
site_description: Migrate local AI coding sessions between Codex, Claude Code, and OpenCode. Includes the inherited UniSessions SDK, CLI, MCP chat recall, and trace export.
site_url: https://leNing-sy.github.io/codex-session-bridge/
repo_url: https://github.com/leNing-sy/codex-session-bridge
repo_name: leNing-sy/codex-session-bridge
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
  - Guides:
    - CLI Reference: cli.md
    - Trace Export: traces.md
    - MCP Server: mcp-server.md
    - Search: search.md
  - Architecture:
    - Overview: architecture.md
    - Stores: stores.md
    - Converters: converters.md
    - Models: models.md
    - Paths: paths.md
    - Data Fidelity: data-fidelity.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/leNing-sy/codex-session-bridge
    - icon: material/source-branch
      link: https://github.com/vibheksoni/session-export
      name: Upstream project (vibheksoni/session-export)
  generator: false

plugins:
  - search
  - tags

copyright: Copyright &copy; 2026 Vibhek Soni (upstream) and contributors — MIT License
