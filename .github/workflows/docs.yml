# Manual only. GitHub Pages is not enabled for this repository, so the deploy job
# fails with `Failed to create deployment (status: 404)` even though the build job
# succeeds. To restore automatic deployment:
#   1. Settings > Pages > Source: select "GitHub Actions".
#   2. Restore the push trigger below.
# Until step 1 is done, a manual run still ends red: the build job passes and the
# deploy job then 404s. Read the build job's own conclusion to check the docs.
name: Deploy Docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs Material
        run: pip install mkdocs-material[imaging]

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
